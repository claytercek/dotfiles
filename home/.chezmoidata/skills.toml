# Community agent skills, fetched by .chezmoiexternal.toml.tmpl into
# ~/.agents/skills/<name>. Personal skills live in dot_agents/ directly.
#
# One table per source repo. `rev` is a commit, or a branch/HEAD to
# track the latest (refetched weekly; `chezmoi apply -R` forces it).
# `paths` maps the skill name to its directory in the repo ("." for
# the repo root).

[skills."blader/humanizer"]
rev = "HEAD"
paths = { humanizer = "." }

[skills."cursor/plugins"]
rev = "HEAD"
paths = { thermo-nuclear-code-quality-review = "cursor-team-kit/skills/thermo-nuclear-code-quality-review" }

[skills."drcathicks/learning-opportunities"]
rev = "HEAD"
paths = { learning-opportunities = "learning-opportunities/skills/learning-opportunities" }

[skills."github/awesome-copilot"]
rev = "HEAD"
paths = { documentation-writer = "skills/documentation-writer" }

[skills."juliusbrussee/caveman"]
rev = "HEAD"
paths = { caveman-commit = "skills/caveman-commit" }

[skills."mattpocock/skills"]
rev = "HEAD"
[skills."mattpocock/skills".paths]
code-review = "skills/engineering/code-review"
handoff = "skills/productivity/handoff"
implement = "skills/engineering/implement"
prototype = "skills/engineering/prototype"
research = "skills/engineering/research"
tdd = "skills/engineering/tdd"
teach = "skills/productivity/teach"
